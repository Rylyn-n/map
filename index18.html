  }

  #map { position: absolute; top:0; bottom:0; left:0; right:0; }

  #legend-drawer { display: contents; } /* 不產生自己的版面，純粹用來讓 JS 切換 class */

  .legend {
    position: absolute; left: 10px; bottom: 56px; z-index: 1000;

    background: white; border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);

    white-space: normal;
    overflow: hidden;
    max-height: 400px;
    transition: max-height 0.25s ease, padding-top 0.25s ease, padding-bottom 0.25s ease, opacity 0.2s ease;
    opacity: 1;
  }
  #legend-drawer.collapsed .legend {
    max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0;
    box-shadow: none; pointer-events: none;
  }
  .legend .title { font-weight: bold; margin-bottom: 4px; display:flex; justify-content:space-between; align-items:center; white-space: nowrap; }
  .legend .reset-btn {
    font-size: 11px; color: #2E75B6; cursor: pointer; border: 1px solid #2E75B6;
    border-radius: 4px; padding: 1px 6px; background: white;
  }
  .legend .reset-btn:hover { background: #EAF2FA; }

  /* 箭頭標籤：固定釘住在同一個位置，展開/收合都不會移動 */
  #legend-tab {
    position: absolute; left: 10px; bottom: 20px; z-index: 1001;
    width: 60px; height: 28px;
    background: white; border: none; border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }

  #legend-tab .arrow {
    display: inline-block; width: 10px; height: 10px;
    border-right: 2px solid #888; border-bottom: 2px solid #888;
    transform: rotate(-135deg);
    transition: transform 0.25s ease;
    margin-top: 4px;
  }
  #legend-drawer:not(.collapsed) #legend-tab .arrow {
    transform: rotate(45deg);
    margin-top: -4px;
  }
  .day-item {
    cursor: pointer; padding: 3px 4px; border-radius: 5px;
    display: flex; align-items: center; transition: background 0.15s;
  }
  .day-item:hover { background: #f0f0f0; }
  .day-item.active { background: #e6f0fa; font-weight: bold; }
  .day-item .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; flex-shrink:0; }

  .marker-label {
    cursor: pointer;
    font-weight: 600;
    pointer-events: auto !important;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }
  .marker-label:hover {
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    transform: scale(1.03);

  .leaflet-popup-content img {
    width: 100%; max-width: 220px; height: 130px; object-fit: cover;
    border-radius: 6px; margin-top: 6px; display:block;
  }
  .leaflet-popup-content { margin: 10px 12px; }

  .online-popup { max-width: 220px; }
  .online-desc {
    font-size: 12.5px; color: #444; margin-top: 6px; line-height: 1.5;
    max-height: 90px; overflow-y: auto;
  }
  .online-desc.online-category { color: #888; font-style: italic; }
  .gmap-btn {

    margin-top: 8px; padding: 8px 10px;
    background: white; color: #4285F4; border: 1.5px solid #4285F4;
    text-decoration: none;
    border-radius: 6px; font-size: 12.5px; font-weight: bold;
    text-align: center;
  }

  #search-box {
    position: absolute; top: 10px; left: 54px; z-index: 1000;
    width: 250px; max-width: calc(60vw - 44px);
  }
  #search-input {
    width: 100%; box-sizing: border-box; padding: 10px 14px;
    border: none; border-radius: 24px; font-size: 14px;

  .search-item .online-name {

  #locate-btn {

  #locate-btn svg { width: 22px; height: 22px; }

  .user-heading-icon { position: relative; width: 40px; height: 40px; }
  .user-heading-dot {
    position: absolute; left: 50%; top: 50%;
    width: 16px; height: 16px; margin-left: -8px; margin-top: -8px;
    background: #4285F4; border: 3px solid white; border-radius: 50%;
    box-shadow: 0 0 4px rgba(0,0,0,0.4);
  }

const markersByDay = {};   // day -> [ {marker, label(tooltip)} ]
const allMarkers = [];

points.forEach(([name, lat, lon, day, note, photoUrl]) => {
  const color = dayColors[day];
  const marker = L.circleMarker([lat, lon], {
    radius: 9,
    fillColor: color,
    color: "#ffffff",
    weight: 2,
    fillOpacity: 0.95
  }).addTo(map);

  marker.bindTooltip(name, {
    permanent: false,
    direction: "top",
    className: "marker-label",
    offset: [0, -8],
    interactive: true   // 讓白色名稱標籤本身也能接收點擊事件
  });
  marker._tooltipName = name; // 保留名稱，供之後重新綁定 tooltip 使用

  const photoHtml = photoUrl
    ? `<img src="${photoUrl}" alt="${name}" loading="lazy">`
    : "";
  marker.bindPopup(`<b>[Day ${day}] ${name}</b><br>${note}${photoHtml}`, { maxWidth: 240 });

  // 點擊白色名稱標籤時，也顯示備註內容（跟點原點一樣打開 popup）
  marker.on('tooltipopen', (e) => {
    const el = e.tooltip.getElement();
    if (el) {
      el.style.cursor = "pointer";
      L.DomEvent.on(el, 'click', (evt) => {
        L.DomEvent.stopPropagation(evt);
        L.DomEvent.preventDefault(evt);
        marker.openPopup();
      });
      L.DomEvent.disableClickPropagation(el);

      // 標籤重疊時：滑鼠移過去暫時提升到最上層，移開後恢復原本堆疊順序
      L.DomEvent.on(el, 'mouseenter', () => {
        el.style.zIndex = 10000;
      });
      L.DomEvent.on(el, 'mouseleave', () => {
        el.style.zIndex = '';
      });
    }
  });

  bounds.push([lat, lon]);
  if (!markersByDay[day]) markersByDay[day] = [];
  markersByDay[day].push(marker);
  allMarkers.push({marker, day});
});

map.fitBounds(bounds, { padding: [40, 40] });

let activeDay = null;
let pinnedDay = null;

function rebindTooltip(marker, permanent) {
  // Leaflet 只有在「綁定當下」讀取 permanent 設定來決定滑鼠事件行為，
  // 事後直接修改 options.permanent 不會生效，必須整個重新綁定才會真正改變行為。
  marker.unbindTooltip();
  marker.bindTooltip(marker._tooltipName, {
    permanent: permanent,
    direction: "top",
    className: "marker-label",
    offset: [0, -8],
    interactive: true
  });
}

function clearHighlight() {
  allMarkers.forEach(({marker}) => {
    if (marker.isTooltipOpen()) marker.closeTooltip();
    rebindTooltip(marker, false);
    marker.setStyle({ radius: 9, fillOpacity: 0.95, weight: 2 });
  });
}

function highlightDay(day) {
  allMarkers.forEach(({marker, day: d}) => {
    if (d == day) {
      marker.setStyle({ radius: 12, fillOpacity: 1, weight: 3 });
      rebindTooltip(marker, true); // 選定的這天標籤常駐顯示，不受滑鼠移動影響
      marker.openTooltip();
    } else {
      marker.setStyle({ radius: 7, fillOpacity: 0.35, weight: 1 });
      if (marker.isTooltipOpen()) marker.closeTooltip();
      rebindTooltip(marker, false);
    }
  });
}

function updateActiveClasses(day) {
  document.querySelectorAll('.day-item').forEach(el => {
    el.classList.toggle('active', day != null && el.dataset.day == day);
  });
}

function enterDay(day) {
  activeDay = day;
  highlightDay(day);
  updateActiveClasses(day);
}

function leaveDay() {
  activeDay = null;
  if (pinnedDay != null) {
    highlightDay(pinnedDay);
    updateActiveClasses(pinnedDay);
  } else {
    clearHighlight();
    updateActiveClasses(null);
  }
}

function clickDay(day) {
  if (pinnedDay === day) {
    // 再次點同一天 -> 取消釘選
    pinnedDay = null;
    clearHighlight();
    updateActiveClasses(null);
  } else {
    pinnedDay = day;
    highlightDay(day);
    updateActiveClasses(day);

    // 將視野移動到該天所有地點範圍
    const dayBounds = allMarkers
      .filter(({day: d}) => d == day)
      .map(({marker}) => marker.getLatLng());
    if (dayBounds.length === 1) {
      map.setView(dayBounds[0], 15);
    } else if (dayBounds.length > 1) {
      map.fitBounds(dayBounds, { padding: [60, 60] });
    }
  }
}

function resetAll() {
  pinnedDay = null;
  activeDay = null;
  clearHighlight();
  updateActiveClasses(null);
  map.fitBounds(bounds, { padding: [40, 40] });
}

// 建立圖例：滑過(hover)預覽，點擊(click)持續釘選
const legendEl = document.getElementById('legend');
let legendHtml = `<div class="title">天數圖例 <span class="reset-btn" onclick="resetAll()">顯示全部</span></div>`;
Object.keys(dayLabels).forEach(d => {
  if (points.some(p => p[3] == d)) {
    legendHtml += `<div class="day-item" data-day="${d}"
      onmouseenter="enterDay(${d})" onmouseleave="leaveDay()" onclick="clickDay(${d})">
      <span class="dot" style="background:${dayColors[d]}"></span>${dayLabels[d]}
    </div>`;
  }
});
legendEl.innerHTML = legendHtml;

function toggleLegend() {
  const drawer = document.getElementById('legend-drawer');
  drawer.classList.toggle('collapsed');
}

// ---------------- 搜尋功能 ----------------
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

let onlineSearchToken = 0;   // 用來忽略過期的線上搜尋回應（避免打字太快時舊結果蓋掉新結果）
let onlineDebounceTimer = null;
let tempSearchMarker = null; // 線上搜尋結果的臨時標記（一次只留一個）

function getLocalMatches(q) {
  const dayMatch = q.match(/^(?:day\s*|d)?(\d)(?:\s*天)?$/i) || q.match(/^第(\d)天$/);
  if (dayMatch) {
    const targetDay = dayMatch[1];
    return points.filter(p => String(p[3]) === targetDay);
  }
  return points.filter(p =>
    p[0].toLowerCase().includes(q) ||
    (dayLabels[p[3]] && dayLabels[p[3]].toLowerCase().includes(q))
  );
}

function renderLocalHtml(matches) {
  if (matches.length === 0) return '';
  return matches.map(([name, lat, lon, day]) => `
    <div class="search-item" data-type="local" data-lat="${lat}" data-lon="${lon}" data-name="${name}">
      <span class="dot" style="background:${dayColors[day]}"></span>
      <span>${name}</span>
      <span class="day-tag">Day${day}</span>
    </div>
  `).join('');
}

let lastOnlineResults = []; // 保留完整的 Nominatim 原始資料，供點擊後查詢維基百科用

function renderOnlineHtml(results) {
  lastOnlineResults = results || [];
  if (!results || results.length === 0) return '';
  const header = `<div class="search-section-label">🌐 線上地點（OpenStreetMap）</div>`;
  const items = results.map((r, idx) => `
    <div class="search-item" data-type="online" data-idx="${idx}" data-lat="${r.lat}" data-lon="${r.lon}" data-name="${escapeHtml(r.display_name)}">
      <span class="pin-icon">📍</span>
      <span class="online-name">${escapeHtml(r.display_name)}</span>
    </div>
  `).join('');
  return header + items;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderCombined(localHtml, onlineHtml, statusHtml) {
  const combined = localHtml + onlineHtml + (statusHtml || '');
  if (!combined) {
    searchResults.innerHTML = `<div class="search-empty">找不到符合的地點</div>`;
  } else {
    searchResults.innerHTML = combined;
  }
  searchResults.style.display = 'block';
}

function renderSearchResults(query) {
  const q = query.trim().toLowerCase();
  clearTimeout(onlineDebounceTimer);
  if (!q) {
    searchResults.style.display = 'none';
    searchResults.innerHTML = '';
    return;
  }

  const localMatches = getLocalMatches(q);
  const localHtml = renderLocalHtml(localMatches);

  // 先立即顯示本地清單比對結果，線上搜尋用 debounce 延遲觸發，避免每打一個字就發一次請求
  renderCombined(localHtml, '', `<div class="search-loading">🌐 搜尋線上地點中...</div>`);

  const myToken = ++onlineSearchToken;
  onlineDebounceTimer = setTimeout(() => {
    queryNominatim(query.trim(), myToken, localHtml);
  }, 500);
}

function queryNominatim(query, token, localHtml) {
  // 沖繩本島大致範圍，作為搜尋結果的權重偏好（非強制限制）
  const viewbox = "127.3,27.05,128.7,25.75";
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}&viewbox=${viewbox}&bounded=0&accept-language=zh-TW,ja&limit=6&extratags=1`;

  fetch(url)
    .then(res => res.json())
    .then(data => {
      if (token !== onlineSearchToken) return; // 已經有更新的搜尋，捨棄這次的結果
      const onlineHtml = renderOnlineHtml(data);
      renderCombined(localHtml, onlineHtml, '');
    })
    .catch(() => {
      if (token !== onlineSearchToken) return;
      renderCombined(localHtml, '', `<div class="search-empty">線上搜尋失敗，請檢查網路連線</div>`);
    });
}

// ---------------- 線上地點：查詢維基百科縮圖／簡介（best-effort，查不到就略過） ----------------
function fetchWikiSummary(extratags) {
  if (!extratags) return Promise.resolve(null);

  // Nominatim 的 wikipedia extratag 格式通常是 "lang:Title"
  if (extratags.wikipedia) {
    const idx = extratags.wikipedia.indexOf(':');
    const lang = idx > -1 ? extratags.wikipedia.slice(0, idx) : 'en';
    const title = idx > -1 ? extratags.wikipedia.slice(idx + 1) : extratags.wikipedia;
    return fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`)
      .then(res => res.ok ? res.json() : null)
      .catch(() => null);
  }

  // 沒有 wikipedia extratag，但有 wikidata ID 的話，先查 wikidata 找出對應的維基百科條目
  if (extratags.wikidata) {
    return fetch(`https://www.wikidata.org/wiki/Special:EntityData/${extratags.wikidata}.json`)
      .then(res => res.json())
      .then(data => {
        const entity = data.entities && data.entities[extratags.wikidata];
        const sitelinks = entity && entity.sitelinks;
        if (!sitelinks) return null;
        const site = sitelinks.zhwiki || sitelinks.jawiki || sitelinks.enwiki;
        if (!site) return null;
        const lang = site.site.replace('wiki', '');
        return fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(site.title)}`)
          .then(r => r.ok ? r.json() : null);
      })
      .catch(() => null);
  }

  return Promise.resolve(null);
}

function buildOnlinePopupHtml(name, lat, lon, category, wiki) {
  const shortName = name.split(/[,，]/)[0].trim();
  // 兩種連結各有取捨，因為沒有 Google 官方地點 ID，無法同時保證「一定精準」又「一定有完整資訊卡片」：
  // 1) 純座標：一定會精準定位到正確地點，但有時只顯示地圖釘選點，沒有照片/評分等完整資訊
  const gmapUrlCoord = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
  // 2) 名稱搜尋：比較容易顯示完整商家資訊卡片，但文字搜尋可能受瀏覽器所在地影響，找到別的地方
  const gmapUrlName = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shortName)}`;

  const thumbHtml = (wiki && wiki.thumbnail && wiki.thumbnail.source)
    ? `<img src="${wiki.thumbnail.source}" alt="${escapeHtml(name)}" loading="lazy">`
    : '';
  const descHtml = (wiki && wiki.extract)
    ? `<div class="online-desc">${escapeHtml(wiki.extract)}</div>`
    : (category ? `<div class="online-desc online-category">${escapeHtml(category)}</div>` : '');
  return `
    <div class="online-popup">
      <b>${escapeHtml(name)}</b>
      ${thumbHtml}
      ${descHtml}
      <a class="gmap-btn" href="${gmapUrlCoord}" target="_blank" rel="noopener">📍 精準定位（座標）</a>
      <a class="gmap-btn" href="${gmapUrlName}" target="_blank" rel="noopener">🔍 用名稱搜尋（可能顯示商家卡片）</a>
    </div>
  `;
}

searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
searchInput.addEventListener('focus', (e) => { if (e.target.value) renderSearchResults(e.target.value); });

searchResults.addEventListener('click', (e) => {
  const item = e.target.closest('.search-item');
  if (!item || !item.dataset.lat) return;
  const lat = parseFloat(item.dataset.lat);
  const lon = parseFloat(item.dataset.lon);
  const name = item.dataset.name;
  const type = item.dataset.type;

  map.setView([lat, lon], 16);

  if (type === 'local') {
    const found = allMarkers.find(({marker}) => {
      const ll = marker.getLatLng();
      return Math.abs(ll.lat - lat) < 1e-6 && Math.abs(ll.lng - lon) < 1e-6;
    });
    if (found) found.marker.openPopup();
  } else {
    // 線上搜尋結果：用臨時標記顯示，一次只保留一個
    if (tempSearchMarker) map.removeLayer(tempSearchMarker);
    tempSearchMarker = L.marker([lat, lon]).addTo(map);

    const idx = parseInt(item.dataset.idx, 10);
    const result = lastOnlineResults[idx];
    const category = result ? [result.type, result.class].filter(Boolean).join(' · ') : '';

    // 先用基本資訊 + Google Maps 連結立即顯示，維基百科資料非同步補上
    tempSearchMarker.bindPopup(buildOnlinePopupHtml(name, lat, lon, category, null), { maxWidth: 260 }).openPopup();

    if (result && result.extratags) {
      fetchWikiSummary(result.extratags).then(wiki => {
        if (wiki && tempSearchMarker) {
          tempSearchMarker.setPopupContent(buildOnlinePopupHtml(name, lat, lon, category, wiki));
        }
      });
    }
  }

  searchInput.value = name;
  searchResults.style.display = 'none';
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#search-box')) {
    searchResults.style.display = 'none';
  }
});

// ---------------- 狀態提示：顯示 3 秒後自動淡出 ----------------
const statusBox = document.getElementById('status-box');
let statusHideTimer = null;

function setStatus(msg) {
  clearTimeout(statusHideTimer);
  statusBox.innerText = msg;
  statusBox.classList.add('visible');
  statusHideTimer = setTimeout(() => {
    statusBox.classList.remove('visible');
  }, 3000);
}

setStatus("滑鼠移到天數可預覽，點擊天數會持續標示並移動視野到該天全部地點");

// ---------------- 定位功能（含方向性圖示，仿 Google Maps） ----------------
let userMarker = null;
let userAccuracyCircle = null;
let currentHeading = null;
let compassActive = false;

function makeUserIcon(heading) {
  if (heading == null) {
    // 尚未知道朝向：顯示單純的藍色圓點
    return L.divIcon({
      className: '',
      html: `<div class="user-heading-icon"><div class="user-heading-dot"></div></div>`,
      iconSize: [40, 40],
      iconAnchor: [20, 20]
    });
  }
  // 已知朝向：改用明顯的箭頭形狀（取代圓點），一眼就能看出面向的方向
  const svg = `
    <svg width="46" height="46" viewBox="0 0 46 46" style="overflow:visible">
      <circle cx="23" cy="23" r="19" fill="rgba(66,133,244,0.25)"/>
      <g transform="rotate(${heading} 23 23)">
        <polygon points="23,5 33,33 23,26 13,33"
                 fill="#4285F4" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
    </svg>`;
  return L.divIcon({
    className: '',
    html: svg,
    iconSize: [46, 46],
    iconAnchor: [23, 23]
  });
}

function locateMe() {
  if (!navigator.geolocation) {
    setStatus("此瀏覽器不支援定位功能");
    return;
  }
  setStatus("定位中，請允許瀏覽器存取你的位置...");

  // iOS 13+ 需要明確請求方向感應權限（需在使用者互動事件內呼叫）
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') startCompass();
    }).catch(() => {});
  } else {
    startCompass();
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const accuracy = pos.coords.accuracy;
      if (pos.coords.heading != null && !isNaN(pos.coords.heading)) {
        currentHeading = pos.coords.heading;
      }

      if (userMarker) map.removeLayer(userMarker);
      if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);

      userAccuracyCircle = L.circle([lat, lon], {
        radius: accuracy,
        color: "#4285F4",
        fillColor: "#4285F4",
        fillOpacity: 0.12,
        weight: 1
      }).addTo(map);

      userMarker = L.marker([lat, lon], {
        icon: makeUserIcon(currentHeading),
        zIndexOffset: 1000
      }).addTo(map);
      userMarker.bindPopup("📍 你目前的位置");

      map.setView([lat, lon], 16);
      setStatus("已定位到你目前的位置");
    },
    (err) => {
      let msg = "無法取得你的位置";
      if (err.code === 1) msg = "定位被拒絕，請到瀏覽器設定允許此網頁存取位置";
      else if (err.code === 2) msg = "無法取得位置資訊（訊號問題）";
      else if (err.code === 3) msg = "定位逾時，請再試一次";
      setStatus(msg);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );

  // 持續追蹤位置與方向（watchPosition 取得移動方向）
  navigator.geolocation.watchPosition(
    (pos) => {
      if (pos.coords.heading != null && !isNaN(pos.coords.heading)) {
        currentHeading = pos.coords.heading;
        if (userMarker) userMarker.setIcon(makeUserIcon(currentHeading));
      }
    },
    () => {},
    { enableHighAccuracy: true }
  );
}

function startCompass() {
  if (compassActive) return;
  compassActive = true;
  const handler = (e) => {
    let heading = null;
    if (typeof e.webkitCompassHeading === 'number') {
      heading = e.webkitCompassHeading;               // iOS Safari：已是正確指北方位
    } else if (e.absolute && e.alpha != null) {
      heading = (360 - e.alpha) % 360;                 // Android：alpha 逆時針，需轉換
    }
    if (heading != null) {
      currentHeading = heading;
      if (userMarker) userMarker.setIcon(makeUserIcon(currentHeading));
    }
  };
  window.addEventListener('deviceorientationabsolute', handler, true);
  window.addEventListener('deviceorientation', handler, true);
}
</script>
